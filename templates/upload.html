<!DOCTYPE html>
<html>
<head>
    <title>Upload Notes</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: url('https://images.unsplash.com/photo-1522202176988-66273c2fd55f') no-repeat center center/cover;
            font-family: Arial;
        }

        .box {
            margin-top: 60px;
            background: rgba(255,255,255,0.9);
            padding: 30px;
            border-radius: 20px;
        }

        .drop-zone {
            border: 2px dashed #888;
            padding: 30px;
            text-align: center;
            border-radius: 10px;
            cursor: pointer;
        }

        .drop-zone:hover {
            background: #f1f1f1;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="box">

        <h3>📤 Upload Notes</h3>

        <!-- 🔍 Search bar -->
        <input type="text" class="form-control mb-3" placeholder="Search previous uploads...">

        <form method="POST" enctype="multipart/form-data">

            <input type="text" name="title" class="form-control my-2" placeholder="Title">

            <input type="text" name="subject" class="form-control my-2" placeholder="Subject">

            <!-- 📁 Drag & Drop -->
            <div class="drop-zone my-3">
                Drag & Drop File Here OR Click
                <input type="file" name="file" class="form-control mt-2">
            </div>

            <button class="btn btn-success w-100">Upload 🚀</button>

        </form>

        <a href="/myuploads">📊 My Upload History</a>

    </div>

</div>

</body>
</html>
