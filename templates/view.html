<!DOCTYPE html>
<html>
<head>
    <title>View Notes</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">

    <h2 class="mb-4">📚 All Notes</h2>

    <!-- Search -->
    <form method="GET">
        <input type="text" name="search" class="form-control" placeholder="Search notes...">
    </form>

    <div class="row mt-4">

        {% for note in notes %}
        <div class="col-md-4">
            <div class="card p-3 shadow-sm mb-3">
                <h5>{{ note.title }}</h5>
                <a href="/uploads/{{ note.filename }}" class="btn btn-primary btn-sm">Download</a>
            </div>
        </div>
        {% endfor %}

    </div>

</div>

</body>
</html>
</html>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
